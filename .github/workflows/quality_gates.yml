name: Quality Gates

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  detect:
    name: Python Changes Detection
    runs-on: ubuntu-latest
    outputs:
      python_changed: ${{ steps.changes.outputs.python_changed }}
      database_changed: ${{ steps.changes.outputs.database_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check if Python or database files changed
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED_FILES=$(gh api \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate \
              --jq '.[].filename')
          else
            CHANGED_FILES=$(git diff --name-only "${{ github.sha }}~1" "${{ github.sha }}")
          fi

          if grep -Eq '(^|/)[^/]+\.py$|^requirements[^/]*\.txt$' <<< "$CHANGED_FILES"; then
            echo "python_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^database/|^flyway\.toml$' <<< "$CHANGED_FILES"; then
            echo "database_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "database_changed=false" >> "$GITHUB_OUTPUT"
          fi

  pylint-analysis:
    name: Pylint Static Code Analysis
    needs: detect
    if: needs.detect.outputs.python_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up dev Python environment
        uses: ./.github/actions/setup-dev-python-env

      - name: Analyze code with Pylint
        id: analyze-code
        run: |
          pylint_score=$(pylint $(git ls-files '*.py')| grep 'rated at' | awk '{print $7}' | cut -d'/' -f1)
          echo "PYLINT_SCORE=$pylint_score" >> $GITHUB_ENV

      - name: Check Pylint score
        run: |
          if (( $(echo "$PYLINT_SCORE < 9.5" | bc -l) )); then
            echo "Failure: Pylint score is below 9.5 (project score: $PYLINT_SCORE)."
            exit 1
          else
            echo "Success: Pylint score is above 9.5 (project score: $PYLINT_SCORE)."
          fi

  black-check:
    name: Black Format Check
    needs: detect
    if: needs.detect.outputs.python_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up dev Python environment
        uses: ./.github/actions/setup-dev-python-env

      - name: Check code format with Black
        id: check-format
        run: black --check $(git ls-files '*.py')

  mypy-check:
    name: Mypy Type Check
    needs: detect
    if: needs.detect.outputs.python_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up dev Python environment
        uses: ./.github/actions/setup-dev-python-env

      - name: Check types with Mypy
        id: check-types
        run: mypy .

  unit-tests:
    name: Pytest Unit Tests with Coverage
    needs: detect
    if: needs.detect.outputs.python_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up dev Python environment
        uses: ./.github/actions/setup-dev-python-env

      - name: Check code coverage with Pytest
        run: pytest --cov=. -v tests/unit/ --cov-fail-under=80

  integration-tests:
    name: Pytest Integration Tests
    needs: detect
    if: needs.detect.outputs.python_changed == 'true' || needs.detect.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up dev Python environment
        uses: ./.github/actions/setup-dev-python-env

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flyway
        uses: red-gate/setup-flyway@e024a17cd0890383f6996ed7edbded24c54ed86c
        with:
          version: '13.3.0'

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short --log-cli-level=INFO

  noop:
    name: No Operation
    needs: detect
    if: needs.detect.outputs.python_changed != 'true' && needs.detect.outputs.database_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No changes in the *.py files — passing."
